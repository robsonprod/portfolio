schema: spec-driven

# Constraints an agent cannot infer by reading the code.
context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: personal portfolio of a senior software engineer targeting AI engineering roles.
  The repository is public and is itself part of the portfolio — artifacts are read by recruiters.

  Hard constraints:
  - Every user-facing text must exist in both English (default) and Portuguese.
  - The Content-Security-Policy is strict (script-src 'self'): no inline scripts, no inline event handlers,
    no third-party script or font hosts unless the CSP change is part of the proposal.
  - Never publish confidential employer or client data (metrics, customer counts, internal names).
  - No long-lived cloud credentials anywhere: CI/CD authenticates to AWS only via GitHub OIDC.
  - All AWS resources are defined in Terraform; nothing is created by hand in the console.
  - Monthly AWS cost must stay under USD 10; any change with recurring cost must state it.
  - Public endpoints must sit behind CloudFront and the WAF; never expose an origin directly.

rules:
  proposal:
    - Always state what is out of scope
    - State the security and cost impact, even if it is "none"
  design:
    - Record each decision with the alternatives considered and why they were rejected
  tasks:
    - Every task group ends with a verification task (test, build, or manual check)
    - Infrastructure tasks include running terraform fmt and validate
