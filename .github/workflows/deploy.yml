# CD: roda a cada push na main. Build → Terraform apply → upload no S3 → invalidação do CloudFront.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Nunca dois deploys ao mesmo tempo; e não cancela um deploy no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/dist/frontend/browser
          retention-days: 7

  release:
    name: Infra + publish
    needs: build
    runs-on: ubuntu-latest
    # O environment é o que libera a role de deploy (trust policy: ...:environment:production).
    # Em Settings → Environments você pode exigir aprovação manual antes de rodar.
    environment:
      name: production
      url: ${{ steps.tf.outputs.site_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform apply
        id: tf
        working-directory: infra/site
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve
          echo "bucket=$(terraform output -raw site_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # Ordem importa (evita HTML novo/antigo apontando para JS que não existe):
      #  1. assets com hash no nome (main-AB12.js): cache de 1 ano, imutável — o nome muda a cada build
      #  2. HTML: no-cache (sempre revalida), senão o visitante fica preso numa versão antiga
      #  3. só no fim remove arquivos que saíram do build
      - name: Upload to S3
        env:
          BUCKET: s3://${{ steps.tf.outputs.bucket }}
        run: |
          # index.csr.html: fallback client-side do Angular, inútil com todas as rotas pré-renderizadas.
          rm -f site/index.csr.html
          aws s3 sync site "$BUCKET" --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync site "$BUCKET" --exclude "*" --include "*.html" --cache-control "no-cache"
          aws s3 sync site "$BUCKET" --delete --size-only

      # "/*" conta como 1 path (1.000 paths/mês grátis). Assets têm hash, então na prática só o HTML muda.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" \
            --paths "/*"

      - name: Summary
        run: echo "### 🚀 Publicado em ${{ steps.tf.outputs.site_url }}" >> "$GITHUB_STEP_SUMMARY"
